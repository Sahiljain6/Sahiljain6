name: Generate pixel portrait

on:
  push:
    branches: [main]
    paths:
      - assets/profile.png
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install image dependency
        run: python -m pip install Pillow

      - name: Build pixel portrait
        run: python scripts/generate_pixel_portrait.py

      - name: Commit generated portrait
        run: |
          # Stage first: --cached correctly detects a newly-created output file.
          git add assets/profile-pixel.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate pixel portrait [skip ci]"
          git push
