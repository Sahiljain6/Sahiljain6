name: Generate contribution calendar

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Add METRICS_TOKEN (a PAT with repo scope) manually in repository settings.
      - name: Generate isocalendar metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Sahiljain6
          template: classic
          base: header, activity, community, repositories, metadata
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          filename: assets/metrics.isocalendar.svg
